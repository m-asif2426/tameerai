<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tameer-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="tameer-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#15803D" />
      <stop offset="50%" stopColor="#22C55E" />
      <stop offset="100%" stopColor="#4ADE80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Blueprint Background Grid -->
  <path d="M20 20 H80 M20 40 H80 M20 60 H80 M20 80 H80" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 2" />
  <path d="M25 15 V85 M50 15 V85 M75 15 V85" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Foundation Base Beam -->
  <rect x="14" y="83" width="72" height="4.5" rx="2.25" fill="url(#tameer-orange)" />

  <!-- AI Neural Network Synapses -->
  <g filter="url(#glow)">
    <path d="M32 64 L50 48 L68 64 M50 26 L50 48 M32 64 L50 74 L68 64 M24 48 L32 64 M76 48 L68 64 M32 38 L50 26 L68 38" stroke="url(#tameer-green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="26" r="3.2" fill="#4ADE80" />
    <circle cx="50" cy="48" r="3.6" fill="#22C55E" />
    <circle cx="50" cy="74" r="2.8" fill="#4ADE80" />
    <circle cx="32" cy="64" r="3" fill="#22C55E" />
    <circle cx="68" cy="64" r="3" fill="#22C55E" />
    <circle cx="24" cy="48" r="2.4" fill="#4ADE80" />
    <circle cx="76" cy="48" r="2.4" fill="#4ADE80" />
    <circle cx="32" cy="38" r="2.2" fill="#86EFAC" />
    <circle cx="68" cy="38" r="2.2" fill="#86EFAC" />
  </g>

  <!-- High-Rise Structure Silhouette Beams -->
  <path d="M50 16 L65 28 V83 H57 V33 L50 27 L43 33 V83 H35 V28 L50 16 Z" fill="url(#tameer-orange)" />
  <path d="M26 40 L35 34 V83 H26 V40 Z" fill="url(#tameer-orange)" fill-opacity="0.95" />
  <path d="M74 40 L65 34 V83 H74 V40 Z" fill="url(#tameer-orange)" fill-opacity="0.95" />
  
  <!-- Safety Apex Gem -->
  <polygon points="50,11 54,16 50,21 46,16" fill="#22C55E" />
